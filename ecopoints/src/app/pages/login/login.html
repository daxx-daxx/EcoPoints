<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <span>♻</span>
    </div>

    <h1>EcoPoints</h1>
    <p class="subtitle">Recicla y recibe recompensas</p>

    <form>
      <label>Email</label>
      <div class="input-box">
        <span>✉</span>
        <input type="email" placeholder="Introduce tu email" />
      </div>

      <label>Contraseña</label>
      <div class="input-box">
        <span>🔒</span>
        <input type="password" placeholder="Introduce tu contraseña" />
      </div>

      <button type="submit">Iniciar Sesión</button>
    </form>

    <p class="link-text">
      No tienes cuenta?
      <a routerLink="/register">Crea una</a>
    </p>
  </div>
</div>
