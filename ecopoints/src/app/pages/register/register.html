<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <span>♻</span>
    </div>

    <h1>Crear Cuenta</h1>
    <p class="subtitle">Únete hoy a EcoPoints</p>

    <form>
      <label>Email</label>
      <div class="input-box">
        <span>✉</span>
        <input type="email" placeholder="Introduce tu email" />
      </div>

      <label>Contraseña</label>
      <div class="input-box">
        <span>🔒</span>
        <input type="password" placeholder="Crea tu contraseña" />
      </div>

      <label>Confirmar contraseña</label>
      <div class="input-box">
        <span>✓</span>
        <input type="password" placeholder="Confirma tu contraseña" />
      </div>

      <button type="submit">Crear Cuenta</button>
    </form>

    <p class="link-text">
      Ya tienes cuenta?
      <a routerLink="/login">Inicia Sesión</a>
    </p>
  </div>
</div>
