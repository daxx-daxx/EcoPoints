  <div class="register-panel">
    <div class="register-logo">
      <svg viewBox="0 0 600 511" aria-hidden="true" focusable="false">
        <path d="M436.75 35.1c-3.45 1.15-6.4 3.05-8.6 5.6-17.8 20.05-34.5 35.5-37.4 34.55-.4-.15-.75.15-.75.65 0 2.7-30.4 15.5-48.5 20.45-19 5.2-49.95 12.2-69 15.6-12.65 2.25-30.2 6.35-37.25 8.7-32.05 10.55-64.15 34.85-80.95 61.25-2.3 3.65-4.55 7.05-5 7.6-1.5 1.8-10.1 19.85-12.6 26.5-11.85 31.2-12.75 67.8-2.45 102.35l1.15 3.85-5.45 5.2c-5.45 5.2-14.95 15.4-14.95 16.05 0 1.3-6.9 10.3-7.5 9.75-.35-.4-.55-.25-.4.3.15.55-1.8 5.25-4.35 10.5-12.75 26.3-18.7 61.35-12.5 73.75 1.45 2.8 2.3 5.4 1.9 5.75-.35.35-.2.5.35.35.55-.2 2.65.65 4.6 1.9 7.5 4.65 17.9 3.8 24.45-1.95 5.55-4.85 6.55-7.8 7.45-21.3 1.6-24.1 7.75-40.55 22.1-58.6l3.1-3.95 3.95 5.25c22.05 29.55 52.3 49.65 89.7 59.55l13.65 3.6h25c52.6-.05 105.1-20.1 140.95-53.85 1.2-1.1 4.85-4.5 8.1-7.6 8.75-8.25 17.3-17.75 23.05-25.65 1.7-2.3 3.4-4 3.75-3.75.35.3.45.2.2-.1-.25-.35 1.25-3.2 3.35-6.25 13.45-20.05 24.1-43.25 30.05-65.65 12.4-46.5 7.85-116.25-10.95-167.5-1.7-4.7-3.25-8.95-3.4-9.5-.15-.55-.75-2.15-1.35-3.5-.65-1.4-2.75-6.35-4.8-11-6.65-15.55-15.8-33.1-18.1-34.95-1.25-1-1.95-2.1-1.55-2.5.4-.4.25-.65-.3-.5-2.25.45-3.6-.1-2.9-1.2.4-.65.3-.9-.2-.6-.5.3-3.05.2-5.65-.2-3.5-.55-6.15-.25-10 1.05Zm3.45 59.75c11.65 29.1 16.9 49.4 20.3 78.55 2.9 25.25 1.75 61.2-2.55 77.1-7 26.05-22.25 56.65-33.9 68.1-1.65 1.6-3 3.3-3 3.8-.1 2.9-25.55 27-27.45 25.9-.6-.35-.8-.25-.4.15.4.45.15 1.3-.5 1.95-2.6 2.55-17.7 12.7-17.7 11.9 0-.45-.35-.3-.75.35-.9 1.4-22.25 12.7-22.25 11.75 0-.35-.55-.2-1.25.4-1.65 1.35-14.75 6.3-14.75 5.55 0-.35-.55-.15-1.25.4-9.15 7.35-57.55 9.95-78 4.25-4-1.15-7.9-2.2-8.75-2.45-3.7-.9-13.05-5-19-8.25-13.55-7.45-32.8-23.85-31.6-26.95.3-.8.15-1.2-.35-.85-1.1.65-3.5-1.55-6.8-6.15l-2.2-3.1 6.2-2.1c3.45-1.15 12.8-3.65 20.75-5.55 37.45-8.9 67.85-22.3 99.35-43.8 29.95-20.35 37.55-34.2 26.2-47.45-1.9-2.25-3.15-4.45-2.75-4.9.4-.4.2-.5-.45-.1-.6.35-2.75-.05-4.7-.85-7.95-3.3-15.05-1.55-23.75 5.9-2.95 2.55-6.05 5.25-6.9 5.95-8.6 7.3-33.8 22.95-35.8 22.2-.7-.3-1.05-.15-.8.3 2.3 3.7-56.5 24.75-71.05 25.5-1.75.1-3 .3-2.8.55.2.2-4.15 1.9-9.75 3.75-11.85 4-10.5 4.65-12.45-5.75-5.2-27.5 3.8-67.5 19.55-87.3 1.7-2.15 3.1-4.2 3.1-4.6 0-.7 14.7-15.8 18.5-18.95 18.6-15.6 32.95-21.15 76.25-29.5 52.1-10.05 89.6-20.7 109.35-31.1 2.55-1.3 4.9-2.1 5.25-1.75.35.35.65.2.65-.35 0-.6 1.2-1.6 2.65-2.25 3.8-1.7 20.25-12.9 23.85-16.15 9.8-8.95 9.75-8.95 11.7-4.1Z" />
      </svg>
    </div>

    <h1 class="register-title">Crear Cuenta</h1>
    <p class="register-subtitle">&Uacute;nete hoy a EcoPoints</p>

    <form class="register-form" novalidate (submit)="onRegister(nameInput.value, emailInput.value, passwordInput.value, confirmPasswordInput.value); $event.preventDefault()">
      <label class="register-field-label">Nombre</label>
      <div class="register-field">
        <span class="register-field-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" focusable="false" xmlns="http://www.w3.org/2000/svg">
            <path d="M10,10 C7.794,10 6,8.206 6,6 C6,3.794 7.794,2 10,2 C12.206,2 14,3.794 14,6 C14,8.206 12.206,10 10,10 M13.758,10.673 C15.124,9.574 16,7.89 16,6 C16,2.686 13.314,0 10,0 C6.686,0 4,2.686 4,6 C4,7.89 4.876,9.574 6.242,10.673 C2.583,12.048 0,15.445 0,20 L2,20 C2,15 5.589,12 10,12 C14.411,12 18,15 18,20 L20,20 C20,15.445 17.417,12.048 13.758,10.673" fill="currentColor" />
          </svg>
        </span>
        <input #nameInput type="text" placeholder="Introduce tu nombre" />
      </div>

      <label class="register-field-label">Email</label>
      <div class="register-field">
        <span>&#9993;</span>
        <input #emailInput type="email" placeholder="Introduce tu email" />
      </div>

      <label class="register-field-label">Contrase&ntilde;a</label>
      <div class="register-field">
        <span class="register-field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" focusable="false" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 14.5V16.5M7 10.0288C7.47142 10 8.05259 10 8.8 10H15.2C15.9474 10 16.5286 10 17 10.0288M7 10.0288C6.41168 10.0647 5.99429 10.1455 5.63803 10.327C5.07354 10.6146 4.6146 11.0735 4.32698 11.638C4 12.2798 4 13.1198 4 14.8V16.2C4 17.8802 4 18.7202 4.32698 19.362C4.6146 19.9265 5.07354 20.3854 5.63803 20.673C6.27976 21 7.11984 21 8.8 21H15.2C16.8802 21 17.7202 21 18.362 20.673C18.9265 20.3854 19.3854 19.9265 19.673 19.362C20 18.7202 20 17.8802 20 16.2V14.8C20 13.1198 20 12.2798 19.673 11.638C19.3854 11.0735 18.9265 10.6146 18.362 10.327C18.0057 10.1455 17.5883 10.0647 17 10.0288M7 10.0288V8C7 5.23858 9.23858 3 12 3C14.7614 3 17 5.23858 17 8V10.0288" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <input #passwordInput [type]="showPassword ? 'text' : 'password'" placeholder="Crea tu contrase&ntilde;a" />
        <button class="register-password-toggle" type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar contrase&ntilde;a' : 'Mostrar contrase&ntilde;a'">
          @if (showPassword) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 3L21 21M10.584 10.587C10.222 10.949 10 11.449 10 12C10 13.105 10.895 14 12 14C12.551 14 13.051 13.778 13.413 13.416M9.363 5.365C10.22 5.13 11.104 5 12 5C16.478 5 20.268 7.943 21.543 12C21.191 13.121 20.647 14.158 19.954 15.076M6.345 6.352C4.535 7.536 3.145 9.519 2.457 12C3.732 16.057 7.522 19 12 19C13.75 19 15.396 18.55 16.827 17.758" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.457 12C3.732 7.943 7.522 5 12 5C16.478 5 20.268 7.943 21.543 12C20.268 16.057 16.478 19 12 19C7.522 19 3.732 16.057 2.457 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 15C13.657 15 15 13.657 15 12C15 10.343 13.657 9 12 9C10.343 9 9 10.343 9 12C9 13.657 10.343 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </button>
      </div>

      <label class="register-field-label">Confirmar contrase&ntilde;a</label>
      <div class="register-field">
        <span>&#10003;</span>
        <input #confirmPasswordInput [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirma tu contrase&ntilde;a" />
        <button class="register-password-toggle" type="button" (click)="toggleConfirmPasswordVisibility()" [attr.aria-label]="showConfirmPassword ? 'Ocultar confirmar contrase&ntilde;a' : 'Mostrar confirmar contrase&ntilde;a'">
          @if (showConfirmPassword) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 3L21 21M10.584 10.587C10.222 10.949 10 11.449 10 12C10 13.105 10.895 14 12 14C12.551 14 13.051 13.778 13.413 13.416M9.363 5.365C10.22 5.13 11.104 5 12 5C16.478 5 20.268 7.943 21.543 12C21.191 13.121 20.647 14.158 19.954 15.076M6.345 6.352C4.535 7.536 3.145 9.519 2.457 12C3.732 16.057 7.522 19 12 19C13.75 19 15.396 18.55 16.827 17.758" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.457 12C3.732 7.943 7.522 5 12 5C16.478 5 20.268 7.943 21.543 12C20.268 16.057 16.478 19 12 19C7.522 19 3.732 16.057 2.457 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 15C13.657 15 15 13.657 15 12C15 10.343 13.657 9 12 9C10.343 9 9 10.343 9 12C9 13.657 10.343 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </button>
      </div>

      @if (errorMessage()) {
        <p class="register-error">
          <span class="register-message__icon" aria-hidden="true">!</span>
          <span>{{ errorMessage() }}</span>
        </p>
      }

      @if (successMessage()) {
        <p class="register-success">
          <span class="register-message__icon" aria-hidden="true">✓</span>
          <span>{{ successMessage() }}</span>
        </p>
      }

      <button class="register-submit-button" type="submit">Crear Cuenta</button>
    </form>

    <p class="register-login-link">
      &iquest;Ya tienes cuenta?
      <a routerLink="/login">Inicia Sesi&oacute;n</a>
    </p>
  </div>
</div>
