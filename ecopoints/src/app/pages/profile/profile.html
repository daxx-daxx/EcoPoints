  <section class="profile-impact" aria-label="Impacto ambiental">
    <h2 class="profile-impact-title">Tu impacto</h2>

    <div class="profile-impact-grid">
      <article class="profile-impact-card">
        <span class="profile-impact-icon" aria-hidden="true">&#9851;</span>
        <p class="profile-impact-value">{{ recycledTimes }}</p>
        <p class="profile-impact-label">Veces Recicladas</p>
      </article>

      <article class="profile-impact-card">
        <span class="profile-impact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 3s6 6.2 6 11a6 6 0 0 1-12 0c0-4.8 6-11 6-11Z" />
          </svg>
        </span>
        <p class="profile-impact-value">{{ savedCo2Kg() }}kg</p>
        <p class="profile-impact-label">CO<sub>2</sub> Ahorrado</p>
      </article>
    </div>
  </section>
</main>
